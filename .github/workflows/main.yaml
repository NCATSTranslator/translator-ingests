# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python

name: Build and test

on:
  push:
    branches: [ main ]

  pull_request:
      types:
          - opened
          - reopened
          - synchronize
          - ready_for_review

jobs:
  # Lint once, separately from the tests, so lint failures are reported even when tests fail.
  # Both tools are configured in pyproject.toml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The package version is computed from git tags, so building it needs the full history with tags
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync

      - name: codespell
        run: uv run codespell

      - name: ruff
        run: uv run ruff check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v7
        with:
          # The package version is computed from git tags, so building it needs the full history with tags
          fetch-depth: 0

      - name: Install uv
        # setup-uv no longer publishes floating major tags (v8+); pin the full version.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: run tests
        run: uv run pytest tests
