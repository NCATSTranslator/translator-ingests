# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python

name: Build and test

on:
  push:
    branches: [ main ]

  pull_request:
      types:
          - opened
          - reopened
          - synchronize
          - ready_for_review

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv no longer publishes floating major tags (v8+); pin the full version.
        uses: astral-sh/setup-uv@v9.0.0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: run tests
        run: make test

