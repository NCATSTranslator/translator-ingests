name: tmkp

readers:
  nodes:
    format: csv
    delimiter: '\t'
    header_mode: none
    files:
      - nodes.tsv.gz
    columns:
      - 'id'
      - 'name'
      - 'category'
  edges:
    format: csv
    delimiter: '\t'
    header_mode: none
    files:
      - edges.tsv.gz
    columns: &edge_columns
      - 'subject'
      - 'predicate'
      - 'object'
      - 'qualified_predicate'
      - 'subject_aspect_qualifier'
      - 'subject_direction_qualifier'
      - 'subject_part_qualifier'
      - 'subject_form_or_variant_qualifier'
      - 'object_aspect_qualifier'
      - 'object_direction_qualifier'
      - 'object_part_qualifier'
      - 'object_form_or_variant_qualifier'
      - 'anatomical_context_qualifier'
      - 'id'
      - 'relation'
      - 'confidence_score'
      - 'supporting_study_results'
      - 'supporting_publications'
      - '_attributes'
  # Chemical -> protein edges rebuilt under corrected concepts, in the same column layout
  # (https://github.com/cbizon/tmkp-cleanup/tree/v1/regulation)
  repaired_edges:
    format: csv
    delimiter: '\t'
    header_mode: none
    files:
      - tmkp_chem_gene_repaired_edges.tsv.gz
    columns: *edge_columns
