name: 'cohd'

readers:
  concepts:
    files:
      - 'concepts.txt'
    format: "csv"
    delimiter: "\t"
    header_mode: "none"
    columns:
      - 'concept_id': 'int'
      - 'concept_name'
      - 'domain'
      - 'vocabulary_id'
      - 'concept_class_id'
      - 'concept_code': 'int'
  single_concept_counts:
    files:
      - '5year_single_concepts.txt'
    format: "csv"
    delimiter: "\t"
    header_mode: "none"
    columns:
      - 'concept_id': 'int'
      - 'count': 'int'
      - 'prevalence': 'float'
  paired_concept_counts:
    files:
      - '5year_paired_concepts.txt'
    format: "csv"
    delimiter: "\t"
    header_mode: "none"
    columns:
      - 'concept_id_1': 'int'
      - 'concept_id_2': 'int'
      - 'count': 'int'
      - 'prevalence': 'float'
