# SIGNOR "complete dataset" export from https://signor.uniroma2.it/downloads.php
# (organism: Homo sapiens, format: tsv). The downloads page submits this as a POST form, but
# download_entity.php returns the same rows for the same parameters over GET, so kghub-downloader
# fetches it directly from SIGNOR (issue #303 replaced the earlier RENCI-hosted copy).
#
# The stable quarterly releases (https://signor.uniroma2.it/releases/getLatestRelease.php) are not used:
# they omit the SCORE column and encode DIRECT as t/f instead of YES/NO, and signor.py relies on both.
#
# The export is a snapshot of the live database, not a release, and its rows come back in a different
# order on every request. It is therefore versioned by its UTC download date; see get_latest_version()
# in signor.py.
- url: https://signor.uniroma2.it/download_entity.php?organism=human&format=csv&submit=Download
  local_name: all_data.tsv
