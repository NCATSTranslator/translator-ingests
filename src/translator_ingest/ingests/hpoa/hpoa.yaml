name: 'human_phenotype_ontology_annotations'

writer:
  # A tripwire for the gene_to_phenotype MENDELIAN filter silently ceasing to
  # apply, as in https://github.com/NCATSTranslator/translator-ingests/issues/537.
  # koza enforces this over the total edges from all the readers below.
  #
  # For scale, the 2026-09-29 HPOA release gives roughly 435,000 edges
  # (269k disease_to_phenotype + 8k gene_to_disease + 159k gene_to_phenotype),
  # and roughly 610,000 if that filter stops applying - the difference being the
  # Orphanet UNKNOWN and OMIM POLYGENIC gene_to_phenotype rows. This ceiling sits
  # between the two, with headroom for upstream growth.
  #
  # If a build fails on this, check whether HPOA genuinely grew before raising it:
  # a jump of this size is more likely to mean the filter broke again.
  max_edge_count: 500000

readers:
  disease_to_phenotype_nodes:
    files:
      - 'phenotype.hpoa'
    header_mode: 4
    format: 'csv'
    delimiter: '\t'
    # For a csv/tsv file, list expected columns
    columns:
      - 'database_id'
      - 'disease_name'
      - 'hpo_id'
  disease_to_phenotype_edges:
    files:
      - 'phenotype.hpoa'
    header_mode: 4
    format: 'csv'
    delimiter: '\t'
    # For a csv/tsv file, list expected columns
    columns:
      - 'database_id'
      - 'qualifier'
      - 'hpo_id'
      - 'reference'
      - 'evidence'
      - 'onset'
      - 'frequency'
      - 'sex'
      - 'modifier'
      - 'aspect'
      - 'biocuration'
  gene_to_disease:
    files:
      - 'genes_to_disease.txt'
    format: 'csv'
    delimiter: '\t'
    columns:
      - 'ncbi_gene_id'
      - 'gene_symbol'
      - 'association_type'
      - 'disease_id'
      - 'source'
    filters:
      - inclusion: 'include'
        column: 'association_type'
        filter_code: 'in'
        value:
          - 'MENDELIAN'
          - 'POLYGENIC'
  gene_to_phenotype:
    files:
      - 'phenotype.hpoa'
      - 'genes_to_disease.txt'
      - 'genes_to_phenotype.txt'
    format: 'csv'
    delimiter: '\t'
    columns:
      - 'ncbi_gene_id'
      - 'gene_symbol'
      - 'hpo_id'
      - 'hpo_name'
      - 'frequency'
      - 'disease_id'
      - 'publications'
      # computed by prepare_gene_to_phenotype_data, not read from a source file.
      # NB: the MENDELIAN restriction on this column is applied in that function's SQL,
      # and cannot be a reader filter here - koza applies reader filters to the raw rows
      # that prepare_gene_to_phenotype_data discards, so a filter here does nothing.
      # See https://github.com/NCATSTranslator/translator-ingests/issues/537
      - 'gene_to_disease_association_types'
