name: 'human_phenotype_ontology_annotations'

writer:
  # Measured against the 2026-09-29 HPOA release: 268,180 disease_to_phenotype
  # + 7,676 gene_to_disease + 158,788 gene_to_phenotype = 434,644 edges.
  # A gene_to_phenotype MENDELIAN filter that stops applying adds 175,196 more
  # (171,700 Orphanet UNKNOWN + 3,496 OMIM POLYGENIC) for 609,840, so this ceiling
  # leaves ~15% headroom for upstream growth while still failing that regression.
  # Raise it deliberately when HPOA genuinely outgrows it, after checking why.
  max_edge_count: 500000

readers:
  disease_to_phenotype_nodes:
    files:
      - 'phenotype.hpoa'
    header_mode: 4
    format: 'csv'
    delimiter: '\t'
    # For a csv/tsv file, list expected columns
    columns:
      - 'database_id'
      - 'disease_name'
      - 'hpo_id'
  disease_to_phenotype_edges:
    files:
      - 'phenotype.hpoa'
    header_mode: 4
    format: 'csv'
    delimiter: '\t'
    # For a csv/tsv file, list expected columns
    columns:
      - 'database_id'
      - 'qualifier'
      - 'hpo_id'
      - 'reference'
      - 'evidence'
      - 'onset'
      - 'frequency'
      - 'sex'
      - 'modifier'
      - 'aspect'
      - 'biocuration'
  gene_to_disease:
    files:
      - 'genes_to_disease.txt'
    format: 'csv'
    delimiter: '\t'
    columns:
      - 'ncbi_gene_id'
      - 'gene_symbol'
      - 'association_type'
      - 'disease_id'
      - 'source'
    filters:
      - inclusion: 'include'
        column: 'association_type'
        filter_code: 'in'
        value:
          - 'MENDELIAN'
          - 'POLYGENIC'
  gene_to_phenotype:
    files:
      - 'phenotype.hpoa'
      - 'genes_to_disease.txt'
      - 'genes_to_phenotype.txt'
    format: 'csv'
    delimiter: '\t'
    columns:
      - 'ncbi_gene_id'
      - 'gene_symbol'
      - 'hpo_id'
      - 'hpo_name'
      - 'frequency'
      - 'disease_id'
      - 'publications'
      # computed by prepare_gene_to_phenotype_data, not read from a source file.
      # NB: the MENDELIAN restriction on this column is applied in that function's SQL,
      # and cannot be a reader filter here - koza applies reader filters to the raw rows
      # that prepare_gene_to_phenotype_data discards, so a filter here does nothing.
      # See https://github.com/NCATSTranslator/translator-ingests/issues/537
      - 'gene_to_disease_association_types'
