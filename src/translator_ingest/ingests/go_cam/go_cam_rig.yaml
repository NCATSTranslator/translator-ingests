    - node_category: biolink:Gene
      source_identifier_types:
        - "UniProtKB"
        - "MGI"
      additional_notes:
        - "Gene identifiers from human and mouse models only (NCBITaxon:9606, NCBITaxon:10090)"

  future_considerations:
    - category: qualifiers
      consideration: >-
        Ambiguous GO-term qualifiers are omitted, not guessed. The networkx export
        collapses several activity-level edges between the same pair of gene products
        into a single row, so source_gene_molecular_function and its five siblings can
        carry the set of terms seen across all of them. The lists are not co-indexed -
        in the release measured, 27 rows have lengths that cannot align, for example
        causal_predicate with 2 values alongside source_gene_molecular_function with 4 -
        so there is no way to tell which term belongs with which assertion. The
        destination qualifier slots are single-valued, so where a field carries more than
        one distinct term the qualifier is left unset rather than narrowed to an
        arbitrary member. This affects roughly 500 edges and omits roughly 650 GO terms;
        the counts are logged per field at the end of each transform run. Revisit if the
        export gains a co-indexed or per-assertion representation, or if Biolink gains
        multivalued forms of these qualifier slots - either would let the terms be
        carried rather than dropped.
    - category: spoq_pattern
      consideration: >-
        Rows carrying several distinct causal_predicate values are split into one edge
        per predicate rather than resolved to the first. Each distinct RO relation
        between the same pair of gene products is a separate causal claim, and in the
        release measured 207 rows carry more than one - in some cases mixing positive and
        negative regulation, so keeping only the first silently discarded a contradictory
        claim. Splitting adds roughly 210 edges. The split edges share the row's
        qualifiers, evidence, publications and sources, because the source provides no
        way to attribute those to one predicate rather than another; each carries its own
        RO term on original_predicate.
    - category: predicates
      consideration: >-
        Known and accepted: roughly half of emitted edges have a subject or object
        category that does not satisfy the Biolink predicate's domain/range constraint.
        biolink:precedes accounts for nearly all of them - its domain and range are both
        "occurrent", while GO-CAM gene-to-gene edges have a Gene (a "physical essence") in
        both slots. The remainder are biolink:has_input, biolink:has_participant,
        biolink:enabled_by and biolink:capable_of, whose domains are
        "biological process or activity". This is the same class of violation flagged for
        the acts_upstream_of family in NCATSTranslator/translator-ingests#339; those
        predicates are no longer emitted, but the underlying gap is not closed by
        replacing them. The cause is structural: GO-CAM asserts these relations between
        molecular activities, the networkx export projects them onto the gene products
        that enable those activities, and Biolink's process-level predicates carry
        process-level domain and range. biolink:regulates is the one predicate that both
        satisfies D/R for Gene-to-Gene and is sanctioned by an RO mapping, and it works
        precisely because RO defines an "enables o P o 'enabled by'" property chain giving
        a genuine gene-product-level counterpart. The causally-upstream family has no such
        chain, so no predicate is both mapping-sanctioned and D/R-valid for it. Resolving
        this needs Biolink Model changes, tracked at
        https://github.com/biolink/biolink-model/issues/1719. Deliberately not worked
        around by choosing a D/R-valid predicate with no mapping support, which would
        trade a visible violation for an unsupported assertion.
    - category: predicates
      consideration: >-
        RO:0002413 "provides input for" is roughly 30% of ingested edges and currently
        maps to biolink:precedes, which is sound but weak. Neither biolink:is_input_of
        (which asserts something false) nor biolink:precedes (which drops the metabolic
        substrate meaning) captures "the product of A's activity is a substrate for B's
        activity". Raise with the GO-CAM team; a dedicated predicate may be warranted.
    - category: edge_properties
      consideration: >-
        Only causal_predicate_assessed_by is emitted as has_evidence_of_type. The edge
        also carries source_gene_product_assessed_by, target_gene_product_assessed_by and
        the *_biological_process / *_occurs_in variants, which evidence the qualifier
        annotations rather than the causal claim. Merging them would overstate the
        evidence behind the edge.
    - category: edge_properties
      consideration: >-
        The causal_predicate_assessed_by, causal_predicate_has_reference and
        causal_predicate_contributors arrays look co-indexed but are not - 83 edges in
        the release measured have mismatched lengths - so evidence, reference and curator
        cannot be reassembled into individual evidence lines. Each is read as an
        independent set.
    - category: predicates
      consideration: >-
        Predicates that currently drop their edges, with reasons: RO:0002408 is obsolete
        in RO; RO:0002614 "is evidence with support from" is not a causal relation;
        RO:0002418, RO:0004046, RO:0004047 and RO:0002332 have no exact or narrow Biolink
        mapping. 17 edges total in the release measured, each counted and logged.
    - category: other
      consideration: >-
        Consider including additional species beyond human, mouse and rat.
    - category: other
      consideration: >-
        Node normalization currently filters out reactome identifiers and certain
        UniProtKB isoform ids such as UniProtKB:P0DTD1-PRO_0000449630.
  additional_notes:
    - >-
        All RO-to-Biolink predicate mappings in this ingest were derived from the Relation
        Ontology and biolink-model rather than from a human reading RO labels. The rules
        that produced them are recorded in the notes below, and the resulting table is a
        static map in ro_predicate_mapping.py. Revisit it after an RO or biolink-model
        release by re-applying those rules to the RO terms the source uses; unit tests
        assert that every predicate in the table is a real Biolink predicate and that the
        table matches what the transform emits.
    - >-
        Why a projection step is needed. GO-CAM models causal relations between molecular
        activities, not between genes: a model is a graph of activity instances, each "enabled
        by" a gene product, with causal edges running activity-to-activity. RO is explicit
        about this - RO:0002629's alternate label is "directly positively regulates (process to
        process)". The networkx export flattens each causal edge into a row whose source and
        target are the gene products, demoting the activities to
        source_gene_molecular_function and target_gene_molecular_function, but it leaves
        causal_predicate as the activity-level RO term. Subject and object are swapped from
        activities to genes while the predicate is not, so the raw row cannot be mapped at face
        value.
    - >-
        Resolution rule 1 - gene-product projection. RO encodes the same projection the
        export performs, as property chains of the form "enables o P o 'enabled by' -> Q". If P
        or a superproperty of P is the middle term of such a chain, the chain head Q is mapped
        to Biolink instead of P. Four such chains exist and are used here: RO:0002211 ->
        RO:0002448, RO:0002629 -> RO:0002450, RO:0002630 -> RO:0002449, and RO:0002411 ->
        RO:0002566. This is what turns RO:0002629 (process to process) into RO:0002450 "directly
        positively regulates activity of", whose rdfs:domain and rdfs:range are both
        BFO:0000040 material entity, and whose superproperty RO:0002448 has the Biolink exact
        mapping biolink:regulates.
    - >-
        Resolution rule 2 - direct resolution. If no projection chain applies, P itself is
        resolved by walking up rdfs:subPropertyOf to the nearest superproperty biolink-model
        maps. Note the RO:0002411 -> RO:0002566 "causally influences" chain is not usable
        because RO:0002566 has no exact or narrow Biolink mapping, so the causally-upstream
        family falls through to direct resolution.
    - >-
        Resolution rule 3 - only exact and narrow mappings are accepted as targets. A narrow
        mapping means the RO term is more specific than the Biolink predicate, so generalizing
        up to it is sound. A broad mapping means the RO term is more general, and asserting the
        narrower Biolink predicate would claim more than the source says. This is why
        RO:0002578 "directly regulates" is not emitted as
        biolink:directly_physically_interacts_with even though biolink-model records the pair:
        it is recorded as a *broad* mapping, and using it would assert physical interaction
        where the source asserts regulation.
    - >-
        Resolution rule 4 - biolink:related_to is never a mapping target. It carries no
        reasoning signal, and an edge asserting it is worse than an absent edge because absence
        is measurable. Predicates with no sound target, and predicates obsolete in RO, cause the
        edge to be dropped and counted with its reason rather than degraded.
    - >-
        Direction derivation. RO annotates directional relations with RO:0004049 "is positive
        form of" and RO:0004050 "is negative form of"; direction is inherited by subsumption, so
        if any superproperty of P is a positive form then P has a positive effect. This is how
        RO:0012010 "removes input for" is known to be negative (via RO:0002305) despite a label
        that says nothing about direction - deriving direction from labels would get it wrong.
        No predicate in the table has conflicting positive and negative ancestors.
    - >-
        Qualified statements are emitted whole or not at all. biolink:qualified_predicate,
        biolink:object_aspect_qualifier and biolink:object_direction_qualifier together read as
        one sentence, "<subject> causes <direction> <aspect> of <object>". A direction on its own
        leaves "increased what?" unanswered, so a direction is only emitted where the projection
        supplies an aspect for it to attach to. See the biolink:precedes edge type's notes for
        the family this excludes and why.
    - >-
        Every emitted predicate is validated as a real Biolink predicate through bmt before
        release; raw RO and BFO CURIEs never appear in the predicate slot. Note that bmt's
        default schema version is not necessarily the biolink-model version this project pins,
        so validation uses get_biolink_model_toolkit(), which builds from the installed schema.
