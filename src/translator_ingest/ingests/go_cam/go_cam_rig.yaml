# Gene Ontology Causal Activity Models (GO-CAM) Reference Ingest Guide (RIG)
name: Gene Ontology Causal Activity Models (GO-CAM) Reference Ingest Guide

# Information about the Source of the data ingest
source_info:
  infores_id: infores:gocam
  name: Gene Ontology Causal Activity Models (GO-CAM)
  description: "GO-CAM (Gene Ontology Causal Activity Models) is developed by the Gene Ontology Consortium as an extension of the GO knowledgebase. It provides computable mechanistic models representing how molecular activities are causally connected to form biological pathways and processes, supporting knowledge representation, computational reasoning, and pathway analysis. GO-CAM models describe molecular activities, biological processes, cellular components, gene products, causal relationships, and supporting evidence using semantic web technologies and biomedical ontologies. Knowledge is generated primarily through expert manual curation in which curators synthesize evidence from the literature into structured causal models, building on existing GO annotations; computational validation and ontology reasoning ensure logical consistency."
  source_status: maintained_regular_updates
  citations:
    - "Thomas PD, Hill DP, Mi H, Osumi-Sutherland D, Van Auken K, Carbon S, Balhoff JP, Albou LP, Good B, Gaudet P, Lewis SE, Mungall CJ. Gene Ontology Causal Activity Modeling (GO-CAM) moves beyond GO annotations to structured descriptions of biological functions and systems. Nat Genet. 2019 Oct;51(10):1429-1433. doi: 10.1038/s41588-019-0500-1"
  terms_of_use_info:
    license_name: "CC BY 4.0 - Creative Commons Attribution 4.0 International License"
  data_access_locations:
    - "GO-CAMs are downloaded model by model, via kghub-downloader that takes an index file that shows all possible gocams by identifier, and then iterates one by one through the identifiers, downloading each gocam."
    - "Index: https://s3.amazonaws.com/provider-to-model.json"
    - "URL pattern: https://live-go-cam.geneontology.io/product/yaml/go-cam/[id].json"
  data_provision_mechanisms:
    - file_download
  data_formats:
    - json
  data_versioning_and_releases: "New GO-CAMs are added to the index weekly. Releases page / change log: https://geneontology.org/docs/download-go-cams/. Latest status page: https://geneontology.org/docs/go-cam-overview/"

# Information about Ingested Content
ingest_info:
  ingest_categories:
    - primary_knowledge_provider
  utility: "GO-CAMs provide structured causal relationships between gene products that are essential for pathway analysis, mechanistic understanding, and systems biology approaches in Translator. Unlike traditional GO annotations, GO-CAMs explicitly model how gene products causally regulate each other, making them valuable for reasoning about biological mechanisms and predicting downstream effects of perturbations."
  scope: "This initial ingest focuses on gene-to-gene causal regulatory relationships extracted from GO-CAM models. The scope includes direct regulatory relationships (positive and negative regulation) between gene products, with associated molecular function, biological process, and cellular component annotations for context."

  relevant_files:
    - file_name: "provider-to-model.json"
      location: "https://s3.amazonaws.com/provider-to-model.json"
      description: "index file of models"
    - file_name: "5a7e68a100001817.json, etc."
      location: "https://live-go-cam.geneontology.io/product/yaml/go-cam/[id].json"
      description: "each model individually"

  included_content:
    - file_name: "5a7e68a100001817.json, etc."
      included_records: "Gene to Gene edges"
      fields_used: "source, target, causal_predicate, causal_predicate_assessed_by, causal_predicate_has_reference, causal_predicate_contributors, source_gene_molecular_function, source_gene_biological_process, source_gene_occurs_in, target_gene_molecular_function, target_gene_biological_process, target_gene_occurs_in, model_info.id, model_info.taxon"

  filtered_content:
    - file_name: "GO-CAM models"
      filtered_records: "GO Term nodes and non-gene entities"
      rationale: "Initial focus on gene-gene relationships; GO Terms and other entity types will be included in future iterations"
    - file_name: "GO-CAM models"
      filtered_records: "Edges without clear causal predicates"
      rationale: "Only including edges with explicit causal relationship predicates to ensure high-quality causal assertions"
    - file_name: "GO-CAM models"
      filtered_records: "No records are filtered on model_info.status"
      rationale: |
        Deliberate non-filter, recorded here because the opposite looks correct.
        model_info.status takes the values production, development, internal_test and
        review, and 'development' reads like draft content. It is not: every
        Reactome-derived GO-CAM model is flagged 'development', accounting for roughly
        71% of that bucket, so filtering to production would silently delete the entire
        infores:reactome knowledge source along with the only edges for which
        infores:go-cam acts as an aggregator. The status distribution is logged at the
        end of each transform run so drift is visible release over release. Do not add a
        status filter without re-checking the status-by-provenance cross-tab first;
        tests/unit/ingests/go_cam/test_go_cam.py guards this.
    - file_name: "GO-CAM models"
      filtered_records: "Reactome pathway ids are not emitted as publications"
      rationale: |
        causal_predicate_has_reference carries PMIDs, GO_REF, MGI reference ids, ISBNs,
        PAINT_REF ids and Reactome pathway ids. All except Reactome are emitted as
        publications, after normalization that repairs the spellings present in the
        source - whitespace and case, a missing PMID prefix, a doubled colon in
        "PMID::29523808", the "GOREF"/"GO:REF" misspellings, and MGI's doubled prefix
        ("MGI:MGI:4417868" becomes "MGI:4417868"). Reactome ids identify pathway records
        rather than literature, so they are carried as source_record_urls on the
        infores:reactome retrieval source instead. No reference value is discarded; any
        that could not be used would be counted and logged in aggregate.

        Note that GO_REF, PAINT_REF and ISBN are not in the Biolink prefix map, so those
        publication CURIEs will not expand to URLs downstream. They are emitted anyway
        because dropping a real reference is worse than emitting one whose prefix is not
        yet registered.
    - file_name: "GO-CAM models"
      filtered_records: "Contributor values that are not ORCIDs"
      rationale: |
        causal_predicate_contributors is mostly ORCID URLs but also carries opaque
        curator-group identifiers such as GOC:reactome_curators, which attributes every
        Reactome-derived edge to a group rather than a person. Those are not
        publications and are dropped.
    - file_name: "GO-CAM models"
      filtered_records: "Non-human/mouse models"
      rationale: "Species filtering applied to include only human (NCBITaxon:9606) and mouse (NCBITaxon:10090) models based on model_info.taxon field"

  future_considerations:
    - category: edge_property_content
      consideration: |
        model_id was removed from edge_properties: it was declared but never emitted,
        and no Biolink association slot holds it. The GO-CAM model a statement came from
        is best expressed as source_record_urls on the infores:go-cam RetrievalSource
        (https://model.geneontology.org/<id>), which needs the same per-edge sources
        refactor as the Reactome reference item below.
    - category: edge_property_content
      consideration: |
        Reactome pathway references are still dropped. 2,756 Reactome-derived edges cite
        a Reactome pathway record as their only reference, and those edges consequently
        carry no publications at all. They are not literature, so they do not belong in
        the publications slot; the natural Biolink home is source_record_urls on the
        infores:reactome RetrievalSource, which requires building the sources list
        per-edge rather than once per model.
    - category: edge_property_content
      consideration: |
        Only causal_predicate_assessed_by is emitted as has_evidence_of_type. The edge
        also carries source_gene_product_assessed_by, target_gene_product_assessed_by,
        and *_biological_process / *_occurs_in variants, which evidence the qualifier
        annotations rather than the causal claim. Merging them into one evidence list
        would overstate the evidence behind the edge.
    - category: edge_property_content
      consideration: |
        The causal_predicate_assessed_by, causal_predicate_has_reference and
        causal_predicate_contributors arrays look co-indexed but are not - 83 edges in
        the release measured have mismatched lengths - so evidence, reference and
        curator cannot be reassembled into individual evidence lines. Each is read as an
        independent set.
    - category: edge_content
      consideration: "Currently, we are excluding GOTerms from the edges. This is just a first pass at the GO-CAMs to get the Gene to Gene edges in place. Future iterations will include the GOTerms, and potentially other edge types."
    - category: node_property_content
      consideration: "Includes only the gene identifier and category of 'Gene'. (Note, there are likely nodes that represent Genes or Gene Products, but we are not distinguishing between these at this time because we will NodeNormalize the category and id.)"
    - category: edge_property_content
      consideration: "TODO: plenty of work to do here to make edges like this, Biolink compliant past the source, target, and causal_predicate which are mapped in this ingest to 'biolink:subject', 'biolink:object', and the appropriate 'biolink:predicate' respectively. The edge properties are not currently being mapped to Biolink Model edge properties, but this will be done in future iterations."
    - category: edge_content
      consideration: |
        Resolved. RO:0012010 ('removes input for') maps to biolink:precedes with a
        decreased direction; RO:0002313 ('transports or maintains localization of')
        resolves weakly to biolink:has_participant; RO:0002408 is obsolete in RO and
        RO:0002614 ('is evidence with support from') is not a causal relation, so both
        drop their edges. Also dropped: RO:0002418, RO:0004046, RO:0004047 and
        RO:0002332, which have no sound Biolink target. 17 edges total are dropped in
        the release measured, each counted and logged with its reason.
    - category: edge_content
      consideration: |
        RO:0002413 'provides input for' is 30% of ingested edges and now maps to
        biolink:precedes rather than biolink:is_input_of, because biolink:is_input_of
        maps exactly to a different RO relation (RO:0002352 'input of'). Confirm the
        intended reading with the GO-CAM team; a dedicated Biolink predicate for
        'the product of A's activity is a substrate for B's activity' would fit better
        than either.
    - category: other
      consideration: "Consider including additional species beyond human and mouse in future iterations."
    - category: other
      consideration: |
        currently node normalization filters out all nodes with reactome identifiers as well as certain kinds of Uniprot ids like UniProtKB:P0DTD1-PRO_0000449630
        UniProtKB:P0DTD1-PRO_0000449631
        UniProtKB:P0DTD1-PRO_0000449633.
