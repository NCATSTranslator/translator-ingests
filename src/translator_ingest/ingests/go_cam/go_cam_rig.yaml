# Information about the Graph Output by the ingest
target_info:
  edge_type_info:
    - subject_categories:
        - biolink:Gene
      predicates:
        - biolink:regulates
      object_categories:
        - biolink:Gene
      knowledge_level:
        - knowledge_assertion
      agent_type:
        - manual_agent
        - automated_agent
      primary_knowledge_sources:
        - infores:go-cam
        - infores:reactome
      aggregator_knowledge_sources:
        - infores:go-cam
      source_files:
        - go-cam-networkx.tar.gz
      edge_properties:
        - has_evidence_of_type
        - publications
        - original_predicate
        - sources
      qualifiers:
        - property: biolink:qualified_predicate
          value_range:
            - biolink:predicate
          value_enumeration:
            - biolink:causes
          value_description: >-
            Set whenever object_aspect_qualifier and object_direction_qualifier are both
            present, so the edge reads as one sentence: "<subject> causes <direction>
            <aspect> of <object>". Follows the convention used by the SIGNOR ingest.
        - property: biolink:object_aspect_qualifier
          value_range:
            - biolink:GeneOrGeneProductOrChemicalEntityAspectEnum
          value_enumeration:
            - activity
          value_description: >-
            Always "activity", derived from the shape of the gene-product projection
            rather than defaulted: the projection chain's third leg is "enabled by", so
            the object is by construction the gene product that enables the regulated
            activity. RO states the same in prose - RO:0002450 is "...has an activity
            that positively regulates an activity performed by B".
        - property: biolink:object_direction_qualifier
          value_range:
            - biolink:DirectionQualifierEnum
          value_enumeration:
            - increased
            - decreased
          value_description: >-
            Derived from RO's own RO:0004049 "is positive form of" and RO:0004050 "is
            negative form of" annotations, inherited by subsumption. Absent for
            RO:0002578 "directly regulates", which RO does not annotate with a direction.
        - property: biolink:subject_activity_qualifier
          value_range:
            - biolink:MolecularActivity
          value_id_prefixes:
            - GO
          value_description: >-
            The GO molecular function the subject gene product enables, from
            source_gene_molecular_function. Present on every edge.
        - property: biolink:subject_process_qualifier
          value_range:
            - biolink:BiologicalProcess
          value_id_prefixes:
            - GO
          value_description: >-
            The GO biological process the subject activity occurs within, from
            source_gene_biological_process.
        - property: biolink:subject_context_qualifier
          value_range:
            - biolink:CellularComponent
          value_id_prefixes:
            - GO
          value_description: >-
            The GO cellular component the subject activity occurs in, from
            source_gene_occurs_in.
        - property: biolink:object_activity_qualifier
          value_range:
            - biolink:MolecularActivity
          value_id_prefixes:
            - GO
          value_description: >-
            The GO molecular function the object gene product enables, from
            target_gene_molecular_function. Present on every edge.
        - property: biolink:object_process_qualifier
          value_range:
            - biolink:BiologicalProcess
          value_id_prefixes:
            - GO
          value_description: >-
            The GO biological process the object activity occurs within, from
            target_gene_biological_process.
        - property: biolink:object_context_qualifier
          value_range:
            - biolink:CellularComponent
          value_id_prefixes:
            - GO
          value_description: >-
            The GO cellular component the object activity occurs in, from
            target_gene_occurs_in.
      ui_explanation: >-
        One gene product's molecular activity regulates another gene product's activity. The edge reads as a single qualified statement - for example "SPATA18 causes increased activity of PTPMT1" - with the GO qualifiers naming which activity, in which biological process, and in which cellular component.
      additional_notes:
        - >-
          Source RO predicates: RO:0002629 (directly positively regulates), RO:0002630
          (directly negatively regulates), RO:0002407 (indirectly positively regulates),
          RO:0002409 (indirectly negatively regulates), RO:0002213 (positively regulates),
          RO:0002578 (directly regulates). All resolve through the gene-product projection
          described in target_info.additional_notes.
        - >-
          The raw RO term is preserved on original_predicate, so the specific relation
          behind a biolink:regulates edge is always recoverable from the edge itself.
    - subject_categories:
        - biolink:Gene
      predicates:
        - biolink:precedes
      object_categories:
        - biolink:Gene
      knowledge_level:
        - knowledge_assertion
      agent_type:
        - manual_agent
        - automated_agent
      primary_knowledge_sources:
        - infores:go-cam
        - infores:reactome
      aggregator_knowledge_sources:
        - infores:go-cam
      source_files:
        - go-cam-networkx.tar.gz
      edge_properties:
        - has_evidence_of_type
        - publications
        - original_predicate
        - sources
      qualifiers:
        - property: biolink:subject_activity_qualifier
          value_range:
            - biolink:MolecularActivity
          value_id_prefixes:
            - GO
          value_description: >-
            The GO molecular function the subject gene product enables, from
            source_gene_molecular_function. Present on every edge.
        - property: biolink:subject_process_qualifier
          value_range:
            - biolink:BiologicalProcess
          value_id_prefixes:
            - GO
          value_description: >-
            The GO biological process the subject activity occurs within, from
            source_gene_biological_process.
        - property: biolink:subject_context_qualifier
          value_range:
            - biolink:CellularComponent
          value_id_prefixes:
            - GO
          value_description: >-
            The GO cellular component the subject activity occurs in, from
            source_gene_occurs_in.
        - property: biolink:object_activity_qualifier
          value_range:
            - biolink:MolecularActivity
          value_id_prefixes:
            - GO
          value_description: >-
            The GO molecular function the object gene product enables, from
            target_gene_molecular_function. Present on every edge.
        - property: biolink:object_process_qualifier
          value_range:
            - biolink:BiologicalProcess
          value_id_prefixes:
            - GO
          value_description: >-
            The GO biological process the object activity occurs within, from
            target_gene_biological_process.
        - property: biolink:object_context_qualifier
          value_range:
            - biolink:CellularComponent
          value_id_prefixes:
            - GO
          value_description: >-
            The GO cellular component the object activity occurs in, from
            target_gene_occurs_in.
      ui_explanation: >-
        One gene product's molecular activity is causally upstream of another's, without a direct regulatory relation being asserted between them.
      additional_notes:
        - >-
          Source RO predicates: RO:0002411 (causally upstream of), RO:0002412 (immediately
          causally upstream of), RO:0002413 (provides input for), RO:0002304 (causally
          upstream of, positive effect), RO:0002305 (causally upstream of, negative
          effect), RO:0012009 (constitutively upstream of), RO:0012010 (removes input
          for). RO defines no enables/enabled-by property chain for these, so they are
          resolved directly; RO:0002411 and RO:0002412 are narrow mappings of
          biolink:precedes, which makes generalizing to it sound.
        - >-
          Domain/range caveat: biolink:precedes has domain and range "occurrent", but
          these edges have a Gene in both slots, so they do not satisfy the predicate's
          D/R constraint. This is known and accepted for now; see the predicates entry in
          target_info.future_considerations and
          https://github.com/biolink/biolink-model/issues/1719.
        - >-
          These edges carry no object_direction_qualifier even though RO annotates several
          of them as positive or negative forms. RO defines RO:0002304 as "the execution
          of p is required for the execution of q" and RO:0002305 as "the execution of p
          decreases the execution of q" - the effect is on the execution of a downstream
          process, not on an activity of the object gene product. After the projection to
          gene products that process is no longer either endpoint, and Biolink's aspect
          enum has no value meaning "occurrence of a downstream process", so there is no
          aspect for a direction to qualify. Emitting one would produce "A precedes B,
          increased", which does not read. The distinction stays recoverable via
          original_predicate.
        - >-
          RO:0002413 "provides input for" is roughly 30% of ingested edges and is the
          weakest mapping in this ingest. It is not biolink:is_input_of: that predicate
          maps exactly to RO:0002352 "input of", whose subject is the material entity
          consumed and whose object is a process. RO defines RO:0002413 as "p provides
          input for q iff ... there exists some c such that p has_output c and q has_input
          c" - the input is a third entity c, which the networkx export does not emit at
          all. Asserting is_input_of would claim the subject gene is itself consumed by
          the object gene. Worth raising with the GO-CAM team.
