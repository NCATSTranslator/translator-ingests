#      - fisher exact p
#      - log odds ratio
#      - log odds ratio 95 ci
#    supporting_data_sources:  TODO: to be elaborated by ICEES team
#      - infores:dili-network-study-data
    ui_explanation: >-
      Observed relationships between clinical characteristics and
      environmental exposures, indexed against associated studies.
    source_files:
