name: "cl_lookup"

metadata:
  description: >-
    Mapping file for lookup from HMDB anatomical or biospecimen location to 
    Cell Ontology (CL; http://purl.obolibrary.org/obo/cl.owl) terms

reader:
  format: "csv"  # actually, 'tsv'

  # This is generated from CL using the project
  # script src/docs/scripts/koza_maps/cl_map.py
  files:
    - './maps/cl_lookup.csv'

  header_mode: "infer"

  columns:
    - "source_term"
    - "cl_id"
    - "cl_label"
    - "match_type"

transform:
  key: "source_term"

  values:
    - "cl_id"
    - "cl_label"
    - "match_type"
